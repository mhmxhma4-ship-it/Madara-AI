name: Deploy Trigger.dev tasks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-dev-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tasks to Trigger.dev Production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Trigger.dev tasks
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: npx --yes trigger.dev@4.8.6 deploy --env prod --external-id "$GITHUB_SHA"
