name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Inspect dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'try { const report = require("./npm-audit.json"); console.log("Vulnerability summary:", report.metadata?.vulnerabilities); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name, item.severity, item.range); } catch { console.log("Audit report unavailable"); }'
      - run: npm run build
